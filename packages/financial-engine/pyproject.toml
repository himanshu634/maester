[project]
name = "maester-financial-engine"
version = "0.1.0"
description = "Shared financial-document extraction, validation, storage, and Q&A for Maester."
requires-python = ">=3.11"
dependencies = ["google-genai>=1.33.0", "pydantic>=2.7", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_financial_qa"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maester
      POSTGRES_PASSWORD: maester
      POSTGRES_DB: maester
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maester"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:

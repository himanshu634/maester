# Local Maester stack: Postgres, the API, the job worker and the web client.
#
#   docker compose up --build      (or: pnpm stack:up)
#
# Everything below runs with local development defaults and no Google Cloud
# account: uploads are kept on a shared Docker volume by STORAGE_DRIVER=disk,
# and the worker pulls its jobs from Postgres (DISPATCH_MODE=queue) instead of
# Cloud Tasks pushing them. Nothing here is a deployment template — see
# infra/README.md for how Maester is deployed.
#
# Fact extraction (the extractor service) calls Claude through the Anthropic
# API. Without ANTHROPIC_API_KEY, extract jobs fail with EXTRACTOR_NOT_CONFIGURED
# and everything else keeps working. To enable it, set in the root .env:
#   ANTHROPIC_API_KEY=<your key from the Anthropic Console>
#
# Indexing and search need the models volume. Once, before the first up:
#   docker compose build indexer && docker compose --profile setup run --rm models
# Until the indexer and the embedder answer, index jobs back off and search says 503.
#
# Memory: the capped services (postgres, embedder, indexer, web) total about 5.9 GiB;
# the api, worker and extractor have no cap until measured. See docs/DEVELOPMENT.md.
name: maester

x-service-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgres://maester:maester@postgres:5432/maester
  # 32 characters minimum. Local only; generate a real one for any shared host.
  BETTER_AUTH_SECRET: local-development-secret-change-me-please
  # The browser's origin. The web container (and `vite dev`) proxy /api/auth, /v1 and
  # /dev here, so the session cookie and signed local upload URLs are first-party.
  BETTER_AUTH_URL: http://localhost:5173
  ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
  # Google sign-in: set both in the root .env to enable it locally.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  STORAGE_DRIVER: disk
  STORAGE_DIR: /var/lib/maester/blobs
  # Confirmation and reset links are written to the api log instead of being sent.
  MAIL_DRIVER: console
  # The worker pulls jobs from Postgres; the API wakes it with NOTIFY job_ready.
  DISPATCH_MODE: queue
  WORKER_URL: http://worker:8788
  # Market mood. CONNECTIONS_KEY (generate with: openssl rand -base64 32) encrypts the Dhan and
  # FRED keys saved in Settings; unset, those routes refuse and the worker does not refresh.
  CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
  DHAN_REQUESTS_PER_SECOND: ${DHAN_REQUESTS_PER_SECOND:-4}
  MARKET_REFRESH_MINUTES: ${MARKET_REFRESH_MINUTES:-30}
  # XBRL: whether each XBRL figure is looked for on its results PDF's statement pages (xbrl_in_pdf). The API and the
  # worker share this anchor on purpose: if they differ, the checks the worker skips read as "not yet" for ever.
  XBRL_PDF_CHECK: ${XBRL_PDF_CHECK:-true}
  # Search embeds the query with the embedder; unanswered, the search route says 503.
  EMBEDDER_URL: http://embedder
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Snowflake/snowflake-arctic-embed-l-v2.0}

services:
  postgres:
    image: pgvector/pgvector:pg16
    shm_size: 1gb
    # An HNSW build needs maintenance_work_mem; shm_size stays at least as large.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "maintenance_work_mem=512MB"]
    mem_limit: 1g
    cpus: 2
    environment:
      POSTGRES_USER: maester
      POSTGRES_PASSWORD: maester
      POSTGRES_DB: maester
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maester"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Drizzle migrations, then exits. The API image ships the
  # migration folder and a dist/migrate.js entry point, the same pair that
  # infra/deploy.sh runs as a Cloud Run job.
  migrate:
    build: *api-build
    image: maester/api:local
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: maester/api:local
    environment:
      <<: *api-env
      PORT: 8787
    cpus: 2
    ports:
      - "8787:8787"
    volumes:
      - blobs:/var/lib/maester/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: maester/worker:local
    environment:
      <<: *api-env
      PORT: 8788
      EXTRACTOR_URL: http://extractor:8790
      EXTRACTOR_SECRET: local-extractor-secret
      INDEXER_URL: http://indexer:8791
      INDEXER_SECRET: local-indexer-secret
      # Bytes from the start of an XML upload that verify keeps, to tell an XBRL instance from any other XML.
      XBRL_SNIFF_BYTES: ${XBRL_SNIFF_BYTES:-65536}
    cpus: 2
    # On stop the worker waits up to 25 s for running jobs; Docker's default 10 s would kill it mid-wait.
    stop_grace_period: 30s
    ports:
      - "8788:8788"
    volumes:
      - blobs:/var/lib/maester/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Stateless Python service the worker streams PDFs to; it reads them with
  # Claude and never touches the database or the blobs volume.
  extractor:
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
    image: maester/extractor:local
    environment:
      PORT: 8790
      EXTRACTOR_SECRET: local-extractor-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-claude-opus-5-5}
      EXTRACTOR_EFFORT: ${EXTRACTOR_EFFORT:-high}
      EXTRACTOR_CLASSIFY_MODEL: ${EXTRACTOR_CLASSIFY_MODEL:-claude-opus-5-5}
      EXTRACTOR_CLASSIFY_EFFORT: ${EXTRACTOR_CLASSIFY_EFFORT:-medium}
      # XBRL limits. A file over any of them is refused XBRL_UNREADABLE and never retried.
      XBRL_MAX_BYTES: ${XBRL_MAX_BYTES:-20971520}
      XBRL_MAX_FACTS: ${XBRL_MAX_FACTS:-100000}
      XBRL_DEADLINE_SECONDS: ${XBRL_DEADLINE_SECONDS:-30}
    cpus: 2
    ports:
      - "8790:8790"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/healthz').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot, run by hand once: fetches the embedding model and Docling's weights
  # into the models volume. Every other service reads that volume offline.
  #   docker compose --profile setup run --rm models
  models:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    image: maester/indexer:local
    command: ["maester-indexer-fetch-models", "--out", "/models"]
    environment:
      # The image sets HF_HUB_OFFLINE=1; this is the one service that downloads.
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/models
    restart: "no"

  # Reads a filing's pages with Docling and cuts them into chunks. Stateless: the
  # worker streams the PDF in and writes the chunks to Postgres itself.
  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    image: maester/indexer:local
    environment:
      PORT: 8791
      INDEXER_SECRET: local-indexer-secret
      DOCLING_ARTIFACTS_PATH: /models/docling
      # The one place the live model is named is EMBEDDING_MODEL; the tokenizer
      # path and the embedder below follow it. The indexer checks that TEI serves it.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Snowflake/snowflake-arctic-embed-l-v2.0}
      INDEX_TOKENIZER_PATH: /models/embed/${EMBEDDING_MODEL:-Snowflake/snowflake-arctic-embed-l-v2.0}
      # OCR_ENGINE is rapidocr or tesseract; INDEX_TABLE_CELL_MATCHING is true or
      # false. Either change gives pages new cache keys, so every range is read again.
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      INDEX_TABLE_CELL_MATCHING: ${INDEX_TABLE_CELL_MATCHING:-true}
      INDEX_THREADS: 6
      INDEX_PAGE_BATCH: 4
      HF_HUB_OFFLINE: 1
    volumes:
      - models:/models:ro
    mem_limit: 2304m
    cpus: 8
    # The memory caps are not measured yet: an OOM kill must not leave the indexer down
    # while a backfill uses up every job's attempts.
    restart: unless-stopped
    ports:
      - "8791:8791"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8791/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # Text Embeddings Inference serving the embedding model on the CPU. The worker
  # embeds chunks with it and the API embeds search queries.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9
    command: ["--model-id", "/models/embed/${EMBEDDING_MODEL:-Snowflake/snowflake-arctic-embed-l-v2.0}", "--max-client-batch-size", "32", "--port", "80"]
    environment:
      HF_HUB_OFFLINE: 1
    volumes:
      - models:/models:ro
    mem_limit: 2560m
    cpus: 8
    restart: unless-stopped
    ports:
      - "8792:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # The eval profile serves ONE candidate embedding model at a time, for
  # `pnpm --filter @maester/worker index:candidate` and `eval rank|bench`. Start it by hand:
  #   CANDIDATE_MODEL=Qwen/Qwen3-Embedding-0.6B docker compose --profile eval up -d embedder-candidate indexer-candidate
  # Unset CANDIDATE_MODEL leaves them unable to start; the live stack does not depend on them.
  # They run beside the live embedder and indexer, so the memory caps add up; the
  # live stack is about 5.9 GiB, and the two together need about 5.25 GiB more.
  embedder-candidate:
    profiles: ["eval"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9
    command: ["--model-id", "/models/embed/${CANDIDATE_MODEL:-none}", "--max-client-batch-size", "32", "--port", "80"]
    environment:
      HF_HUB_OFFLINE: 1
    volumes:
      - models:/models:ro
    mem_limit: 3072m
    cpus: 8
    ports:
      - "8793:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # The candidate's indexer: the live indexer's settings, with the candidate's tokenizer.
  # Unset CANDIDATE_MODEL leaves it unable to start; the live stack does not depend on it.
  indexer-candidate:
    profiles: ["eval"]
    image: maester/indexer:local
    environment:
      PORT: 8791
      INDEXER_SECRET: local-indexer-secret
      DOCLING_ARTIFACTS_PATH: /models/docling
      EMBEDDING_MODEL: ${CANDIDATE_MODEL:-none}
      INDEX_TOKENIZER_PATH: /models/embed/${CANDIDATE_MODEL:-none}
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      INDEX_TABLE_CELL_MATCHING: ${INDEX_TABLE_CELL_MATCHING:-true}
      INDEX_THREADS: 6
      INDEX_PAGE_BATCH: 4
      HF_HUB_OFFLINE: 1
    volumes:
      - models:/models:ro
    mem_limit: 2304m
    cpus: 8
    ports:
      - "8794:8791"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8791/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # The web client, served statically by nginx, which proxies /api/auth, /v1 and
  # /dev to the API. Sign in at http://localhost:5173/login.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: maester/web:local
    environment:
      NGINX_RESOLVER: 127.0.0.11
      API_PROXY_TARGET: http://api:8787
      API_PROXY_HOST: localhost:5173
    mem_limit: 96m
    cpus: 1
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  blobs:
  models:

# Local Maester stack: Postgres, the API, the job worker and the web client.
#
#   docker compose up --build      (or: pnpm stack:up)
#
# Everything below runs with local development defaults and no Google Cloud
# account: uploads are kept on a shared Docker volume by STORAGE_DRIVER=disk,
# and jobs are dispatched over plain HTTP instead of Cloud Tasks. Nothing here
# is a deployment template — see infra/README.md for how Maester is deployed.
#
# Fact extraction (the extractor service) calls Gemini on Vertex AI, which does
# need Google Cloud. Without GOOGLE_CLOUD_PROJECT and Application Default
# Credentials, extract jobs fail with EXTRACTOR_NOT_CONFIGURED and everything
# else keeps working. To enable it, set in the root .env:
#   GOOGLE_CLOUD_PROJECT=<your project>
#   GCLOUD_CONFIG_DIR=<absolute path to ~/.config/gcloud>  (after gcloud auth application-default login)
name: maester

x-service-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgres://maester:maester@postgres:5432/maester
  # 32 characters minimum. Local only; generate a real one for any shared host.
  BETTER_AUTH_SECRET: local-development-secret-change-me-please
  # The browser's origin. The web container (and `vite dev`) proxy /api/auth, /v1 and
  # /dev here, so the session cookie and signed local upload URLs are first-party.
  BETTER_AUTH_URL: http://localhost:5173
  ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
  STORAGE_DRIVER: disk
  STORAGE_DIR: /var/lib/maester/blobs
  DISPATCH_MODE: local
  DISPATCH_SECRET: local-dispatch-secret
  WORKER_URL: http://worker:8788

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maester
      POSTGRES_PASSWORD: maester
      POSTGRES_DB: maester
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maester"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Drizzle migrations, then exits. The API image ships the
  # migration folder and a dist/migrate.js entry point, the same pair that
  # infra/deploy.sh runs as a Cloud Run job.
  migrate:
    build: *api-build
    image: maester/api:local
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: maester/api:local
    environment:
      <<: *api-env
      PORT: 8787
    ports:
      - "8787:8787"
    volumes:
      - blobs:/var/lib/maester/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: maester/worker:local
    environment:
      <<: *api-env
      PORT: 8788
      EXTRACTOR_URL: http://extractor:8790
      EXTRACTOR_SECRET: local-extractor-secret
    ports:
      - "8788:8788"
    volumes:
      - blobs:/var/lib/maester/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Stateless Python service the worker streams PDFs to; it reads them with
  # Gemini and never touches the database or the blobs volume.
  extractor:
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
    image: maester/extractor:local
    environment:
      PORT: 8790
      EXTRACTOR_SECRET: local-extractor-secret
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      GOOGLE_APPLICATION_CREDENTIALS: /var/lib/maester/gcloud/application_default_credentials.json
    volumes:
      - ${GCLOUD_CONFIG_DIR:-./data/gcloud}:/var/lib/maester/gcloud:ro
    ports:
      - "8790:8790"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/healthz').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The web client, served statically by nginx, which proxies /api/auth, /v1 and
  # /dev to the API. Sign in at http://localhost:5173/login.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: maester/web:local
    environment:
      NGINX_RESOLVER: 127.0.0.11
      API_PROXY_TARGET: http://api:8787
      API_PROXY_HOST: localhost:5173
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  blobs:

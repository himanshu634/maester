<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 454" width="1120" height="454" role="img" aria-labelledby="title desc">
<title id="title">Where a statement's numbers come from</title>
<desc id="desc">For a results PDF, three rules are tried in order. First, if XBRL for the same company and period end can still settle, the PDF waits. Second, if settled XBRL covers every statement and basis the PDF prints, the numbers come from XBRL with no model and the PDF is set to read with no revision. Otherwise Claude reads the PDF in four steps: locate statement pages, read each statement, check sums and the balance identity, and re-read a failing part at most twice.</desc>
<style>
  text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: #EDEDE8; }
  .t { font-size: 14px; font-weight: 700; fill: #000000; }
  .s { font-size: 12px; fill: #5F5F5B; }
  .lbl { font-size: 11.5px; fill: #5F5F5B; }
  .tt { font-size: 12.5px; font-weight: 700; fill: #000000; }
  .box { fill: #EDEDE8; stroke: #000000; stroke-width: 2; }
  .tag { fill: #EDEDE8; stroke: #000000; stroke-width: 1.25; }
  .ext { fill: #EDEDE8; stroke: #5F5F5B; stroke-width: 1; }
  .pend { fill: #EDEDE8; stroke: #5F5F5B; stroke-width: 2; stroke-dasharray: 6 5; }
  .inv { fill: #000000; stroke: #000000; stroke-width: 2; }
  .invt { fill: #EDEDE8; }
  .ln { stroke: #000000; stroke-width: 1.5; fill: none; }
  .lnm { stroke: #5F5F5B; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .arrowhead { fill: #000000; }
  .arrowhead-m { fill: #5F5F5B; }
</style>
<rect class="bg" x="0" y="0" width="1120" height="454"/>
<text class="tt" x="20" y="30" style="font-size:16px">Where a statement's numbers come from</text>
<text class="lbl" x="1100" y="30" text-anchor="end">Staging, 30 October 2026</text>
<g transform="translate(20,54)">
        <defs>
          <marker id="s-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <rect class="box" x="20" y="140" width="170" height="60"/>
        <text class="t" x="105" y="166" text-anchor="middle">A results PDF</text>
        <text class="s" x="105" y="184" text-anchor="middle">with a known period</text>
        <line class="ln" x1="190" y1="170" x2="248" y2="170" marker-end="url(#s-a)"/>
        <line class="ln" x1="220" y1="60" x2="220" y2="290"/>
        <line class="ln" x1="220" y1="60" x2="248" y2="60" marker-end="url(#s-a)"/>
        <line class="ln" x1="220" y1="290" x2="248" y2="290" marker-end="url(#s-a)"/>
        <text class="lbl" x="214" y="52" text-anchor="end">1st</text>
        <text class="lbl" x="214" y="162" text-anchor="end">2nd</text>
        <text class="lbl" x="214" y="282" text-anchor="end">3rd</text>

        <!-- rule 1: wait -->
        <rect class="tag" x="250" y="30" width="230" height="60"/>
        <text class="tt" x="262" y="54">XBRL can still settle</text>
        <text class="lbl" x="262" y="72">same company and period end</text>
        <line class="ln" x1="480" y1="60" x2="528" y2="60" marker-end="url(#s-a)"/>
        <rect class="box" x="530" y="30" width="260" height="60"/>
        <text class="t" x="546" y="54">The PDF waits</text>
        <text class="s" x="546" y="72">waiting_for_xbrl, decided again later</text>

        <!-- rule 2: covered -->
        <rect class="tag" x="250" y="140" width="230" height="60"/>
        <text class="tt" x="262" y="164">Settled XBRL covers every</text>
        <text class="lbl" x="262" y="182">statement and basis the PDF prints</text>
        <line class="ln" x1="480" y1="170" x2="528" y2="170" marker-end="url(#s-a)"/>
        <rect class="box" x="530" y="140" width="260" height="60"/>
        <text class="t" x="546" y="164">Numbers come from XBRL</text>
        <text class="s" x="546" y="182">parser + element map · no model</text>
        <line class="ln" x1="790" y1="170" x2="838" y2="170" marker-end="url(#s-a)"/>
        <rect class="tag" x="840" y="140" width="220" height="60"/>
        <text class="tt" x="852" y="164">PDF set to read</text>
        <text class="lbl" x="852" y="182">no revision; Claude never called</text>

        <!-- rule C -->
        <rect class="tag" x="250" y="260" width="230" height="60"/>
        <text class="tt" x="262" y="284">Otherwise</text>
        <text class="lbl" x="262" y="302">no XBRL, or it misses a statement</text>
        <line class="ln" x1="480" y1="290" x2="528" y2="290" marker-end="url(#s-a)"/>
        <rect class="box" x="530" y="260" width="115" height="60"/>
        <text class="t" x="587" y="284" text-anchor="middle">1 Locate</text>
        <text class="s" x="587" y="302" text-anchor="middle">statement pages</text>
        <line class="ln" x1="645" y1="290" x2="663" y2="290" marker-end="url(#s-a)"/>
        <rect class="box" x="665" y="260" width="115" height="60"/>
        <text class="t" x="722" y="284" text-anchor="middle">2 Read</text>
        <text class="s" x="722" y="302" text-anchor="middle">each statement</text>
        <line class="ln" x1="780" y1="290" x2="798" y2="290" marker-end="url(#s-a)"/>
        <rect class="box" x="800" y="260" width="115" height="60"/>
        <text class="t" x="857" y="284" text-anchor="middle">3 Check</text>
        <text class="s" x="857" y="302" text-anchor="middle">sums, identity</text>
        <line class="ln" x1="915" y1="290" x2="933" y2="290" marker-end="url(#s-a)"/>
        <rect class="box" x="935" y="260" width="115" height="60"/>
        <text class="t" x="992" y="284" text-anchor="middle">4 Re-read</text>
        <text class="s" x="992" y="302" text-anchor="middle">the failing part</text>
        <polyline class="ln" points="992,320 992,345 857,345 857,322" marker-end="url(#s-a)"/>
        <text class="lbl" x="925" y="362" text-anchor="middle">at most 2 tries</text>
        <text class="lbl" x="530" y="345">each fact keeps its page and quote;</text>
        <text class="lbl" x="530" y="361">a refused statement fails only itself</text>
      </g>
</svg>

[project]
name = "maester-cli"
version = "0.1.0"
description = "Maester's local command-line application."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["maester-financial-engine==0.1.0", "typer>=0.12", "rich>=13.7"]

[project.scripts]
maester = "maester_cli.cli:app"
pdf-financial-qa = "maester_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maester_cli"]

[project]
name = "maester-extractor"
version = "0.1.0"
description = "Maester's document extraction service: an HTTP sidecar over the LangGraph workflow."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["maester-financial-engine==0.1.0", "fastapi>=0.120", "uvicorn>=0.30"]

[project.scripts]
maester-extractor = "maester_extractor.__main__:main"

[tool.fastapi]
entrypoint = "maester_extractor.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maester_extractor"]

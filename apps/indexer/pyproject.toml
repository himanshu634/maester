[project]
name = "maester-indexer"
version = "0.1.0"
description = "Maester's document indexer: reads page ranges of a filing with Docling and RapidOCR and cuts them into chunks for search."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.134.0",
    "docling-core==2.103.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.31.0",
    "torch",
    "torchvision",
    "fastapi>=0.120",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.scripts]
maester-indexer = "maester_indexer.__main__:main"
maester-indexer-fetch-models = "maester_indexer.fetch_models:main"
maester-indexer-ocr-sample = "maester_indexer.ocr_sample:main"

[dependency-groups]
dev = ["httpx", "reportlab", "pillow"]
# scripts/embedding_parity.py only: the reference vectors a candidate model is checked against. Not in the image.
parity = ["sentence-transformers==6.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maester_indexer"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

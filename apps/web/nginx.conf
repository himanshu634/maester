server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SvelteKit's static adapter emits /login as login.html (trailingSlash: never).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 404.html is the app shell: the client renders the not-found page (src/routes/+error.svelte).
    error_page 404 /404.html;
    # 50x.html is plain HTML with no script, for nginx's own 5xx responses.
    error_page 500 502 503 504 /50x.html;
}
